  <style>
    :root {
      --page-padding-top: 8px;
      --page-padding-right: 10px;
      --page-padding-bottom: 10px;
      --page-padding-left: 10px;
      --site-font-size: 18px;
      --archive-text-font-size: 18px;
      --archive-list-font-size: 18px;
      --archive-list-title-font-size: 22px;
      --archive-list-date-font-size: 16px;
      --archive-list-author-font-size: 13px;
      --gallery-title-font-size-desktop: 18px;
      --gallery-title-font-size-mobile: 18px;
      --gallery-image-gap: 21px;
      --gallery-row-gap: 21px;
      --gallery-block-gap: 21px;
      --gallery-image-height: 25vh;
      --gallery-horizontal-image-height: 50vh;
      --nav-font-size: 18px;
      --site-line-height: 1.3;
      --site-letter-spacing: 1px;
      --site-color: #000000;
      --color-about: #000000;
      --color-archive: #000000;
      --color-event-title: #000000;
      --color-event-text: #000000;
      --color-menu: #000000;
      --bg-about: #ffffff;
      --bg-archive: #ffffff;
      --bg-event: #ffffff;
      --bg-event-gallery: #ffffff;
      --bg-event-text: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #fff;
      font-family: 'Helvetica Neue', 'Helvetica', sans-serif;
      font-size: var(--site-font-size);
      line-height: var(--site-line-height);
      letter-spacing: var(--site-letter-spacing);
      color: var(--site-color);
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    .layout {
      display: flex;
      flex-direction: column;
      width: 100vw;
    }

    .ver2-section {
      position: relative;
      width: 100%;
      padding-top: var(--page-padding-top);
      padding-bottom: var(--page-padding-bottom);
    }

    .ver2-top-screen {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .ver2-nav-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0;
      margin: 0 var(--page-padding-right) 0 var(--page-padding-left);
      flex: 0 0 auto;
    }

    .ver2-nav-top-row {
      position: relative;
      z-index: 301;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .archive-category-label {
      color: var(--color-menu);
      font-size: var(--nav-font-size);
      line-height: var(--site-line-height);
      text-align: center;
      margin-bottom: calc(var(--site-line-height) * 1em);
    }

    .ver2-nav-dropdown-toggle {
      display: none;
    }

    .ver2-nav-close {
      display: none;
    }

    .ver2-nav-bar .nav-static {
      display: none;
    }

    .ver2-nav-bar.open .nav-static {
      display: flex;
      position: fixed;
      inset: 0;
      background: #ffffff;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      gap: 0;
      line-height: var(--site-line-height);
      width: 100%;
      padding-top: var(--nav-overlay-offset, calc(var(--page-padding-top) + var(--nav-font-size) * var(--site-line-height)));
      z-index: 300;
    }

    .ver2-nav-bar.open .nav-static a[data-view] {
      transform: translateX(var(--nav-overlay-center-offset, 0px));
    }

    .ver2-nav-bar.open .nav-static .nav-language-group {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .ver2-nav-burger {
      align-self: flex-end;
      display: block;
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      cursor: pointer;
      font-family: inherit;
      color: var(--color-menu);
      opacity: 0.4;
      font-size: var(--nav-font-size);
      line-height: var(--site-line-height);
    }

    .ver2-nav-burger:hover {
      opacity: 1;
      color: #000000;
    }

    .ver2-detail-full {
      width: 100%;
      padding-bottom: var(--page-padding-bottom);
    }

    .ver2-hero-about {
      display: none;
      flex: 0 0 auto;
      width: 100%;
      padding: 0 var(--page-padding-right) 0 var(--page-padding-left);
      color: var(--color-menu);
    }

    .ver2-hero-about.visible {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
    }

    /* Debug visualization: every spacing gap introduced this session is a
       real element with a random background instead of invisible
       margin/gap, so the spacing itself is visible. Direct children of
       .ver2-section (which has no horizontal padding) span the full page
       width on their own; spacers nested inside a padded container use a
       negative-margin breakout matching that container's own padding. */
    .gap-spacer {
      display: block;
      width: 100%;
    }

    .gap-spacer-breakout {
      display: block;
      width: auto;
      margin-left: calc(-1 * var(--page-padding-left));
      margin-right: calc(-1 * var(--page-padding-right));
    }

    .about-gap-spacer {
      flex: 0 0 1em;
      align-self: stretch;
    }

    .ver2-hero-about-col {
      flex: 0 0 70ch;
      max-width: 70ch;
      min-width: 0;
    }

    .about-gap-spacer ~ .ver2-hero-about-col {
      padding-left: calc(var(--page-padding-left) / 2);
    }

    .ver2-hero-about p {
      margin-bottom: 16px;
    }

    .ver2-hero-about p:last-child {
      margin-bottom: 0;
    }

    .ver2-wordmark {
      display: inline-block;
      text-decoration: none;
      color: #000000;
      cursor: pointer;
      font-size: var(--nav-font-size);
      line-height: var(--site-line-height);
      text-align: center;
    }

    .archive-close {
      margin-left: auto;
      text-decoration: none;
      cursor: pointer;
      color: #999999 !important;
    }

    .archive-close:hover {
      color: #000000 !important;
    }

    .about-highlight {
      cursor: pointer;
      text-decoration: underline;
    }

    .archive-detail-header {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0;
      width: 100%;
      padding-top: 2px;
      margin: calc(var(--site-line-height) * 2em) var(--page-padding-right) calc(var(--site-line-height) * 1em) 0;
    }

    .archive-detail-header .detail-close {
      position: absolute;
      top: 2px;
      right: 0;
    }


    .archive-detail-identity-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
    }

    .archive-detail-identity-row .archive-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: default;
    }

    .archive-detail-identity-row .archive-item .archive-number,
    .archive-detail-identity-row .archive-item .archive-title,
    .archive-detail-identity-row .archive-item .archive-date,
    .archive-detail-identity-row .archive-item .archive-authors {
      font-size: var(--nav-font-size);
    }

    .archive-detail-identity-row .archive-item .archive-number {
      display: none;
    }

    .archive-detail-identity-row .archive-item .archive-title {
      font-style: italic;
    }

    .feed-separator {
      width: 100%;
      padding: 0 var(--page-padding-right) 0 var(--page-padding-left);
      line-height: var(--site-line-height);
    }


    .content-container {
      display: none;
      width: 100%;
      background: var(--bg-event);
      padding: 0 var(--page-padding-right) 0 var(--page-padding-left);
      gap: 0;
    }

    .content-container.visible {
      display: flex;
      flex-direction: column;
    }

    .archive-detail-tabs {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin-bottom: 5px;
      font-size: var(--nav-font-size);
      line-height: var(--site-line-height);
    }

    .archive-detail-tab {
      cursor: pointer;
      color: #999999;
    }

    .archive-detail-tab.active {
      color: #000000;
    }

    .archive-detail-switch {
      position: relative;
      flex: 0 0 auto;
      width: 2.2em;
      height: 1.2em;
      border-radius: 1em;
      background: #000000;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    .archive-detail-switch-knob {
      position: absolute;
      top: 0.15em;
      left: 0.15em;
      width: 0.9em;
      height: 0.9em;
      border-radius: 50%;
      background: #ffffff;
      transition: transform 0.2s ease;
    }

    .archive-detail-switch[data-active-tab="images"] .archive-detail-switch-knob {
      transform: translateX(1em);
    }

    .archive-detail-columns {
      width: 100%;
    }

    .archive-detail-columns[data-active-tab="images"] .content-text-row {
      display: none;
    }

    .archive-detail-columns[data-active-tab="text"] .content-media-col {
      display: none;
    }

    .content-media-col {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      row-gap: var(--gallery-block-gap);
      column-gap: var(--page-padding-right);
      background: var(--bg-event-gallery);
      width: 100%;
      padding-top: 0;
      margin-top: 0;
    }

    .content-gallery-col {
      position: relative;
      box-sizing: border-box;
      width: 100%;
      display: flex;
      flex-direction: column;
      height: auto;
    }

    .content-gallery-col-auto {
      height: auto;
      box-sizing: border-box;
      width: 100%;
    }

    .content-gallery-strip {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: flex-start;
      row-gap: var(--gallery-row-gap);
      column-gap: var(--gallery-image-gap);
      width: 100%;
    }

    .content-gallery-strip-item {
      position: relative;
      cursor: pointer;
      display: block;
      flex: 0 0 auto;
      height: var(--gallery-image-height);
    }

    .content-gallery-strip-item img {
      display: block;
      width: auto;
      height: 100%;
      object-fit: contain;
    }

    .content-gallery-horizontal {
      position: relative;
      display: block;
      width: 100%;
    }

    .content-gallery-horizontal-img {
      display: none;
      width: 100%;
      height: var(--gallery-horizontal-image-height);
      object-fit: contain;
      object-position: left top;
    }

    .content-gallery-horizontal-img.active {
      display: block;
    }

    .content-gallery-horizontal-hit {
      position: absolute;
      top: 0;
      left: 0;
    }

    .content-image-count {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      margin-top: 0;
    }

    .content-gallery-name {
      color: #000000;
      font-size: var(--gallery-title-font-size-desktop);
    }

    .content-text-col {
      width: 100%;
      min-width: 0;
      margin-top: 0;
      text-align: left;
      display: grid;
      grid-template-columns: 130px 1fr;
      column-gap: 10px;
      align-items: start;
    }

    .content-panel-header {
      padding-top: 0;
      padding-bottom: 3px;
      margin: 0;
      font-size: var(--archive-text-font-size);
      color: #000000;
    }

    .content-panel-header + .archive-detail-body,
    .content-panel-header + .content-additional-text {
      margin-top: 0;
    }

    .content-text-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      background: var(--bg-event-text);
    }

    .content-text-row .gap-spacer-breakout {
      height: 1em;
    }

    .content-text-row .accordion-panel {
      box-sizing: border-box;
      width: auto;
      max-width: 100%;
    }

    svg {
      cursor: default;
      user-select: none;
      overflow: visible;
    }

    .nav-static {
      display: flex;
      flex-direction: row;
      gap: 40px;
    }

    .nav-static a {
      text-decoration: none;
      padding: 0;
      cursor: pointer;
      color: var(--color-menu);
      opacity: 0.4;
      font-size: var(--nav-font-size);
      line-height: var(--site-line-height);
    }

    .nav-static a:hover {
      text-decoration: none;
      opacity: 1;
      color: #000000;
    }

    .nav-language-group {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 20px;
    }

    .nav-language-group a {
      text-decoration: none;
      cursor: pointer;
      color: var(--color-menu);
      opacity: 0.4;
      font-size: var(--nav-font-size);
      line-height: var(--site-line-height);
    }

    .nav-language-group a:hover {
      opacity: 1;
      color: #000000;
    }

    .nav-language-group a.active {
      opacity: 1;
      color: #000000;
    }

    .archive {
      display: none;
      position: relative;
      width: 100%;
      padding: 0 var(--page-padding-right) 0 var(--page-padding-left);
      overflow-x: hidden;
    }

    .archive.visible {
      display: block;
    }

    @media (max-width: 700px) {

      .ver2-nav-burger {
        align-self: flex-start;
      }

      .archive-detail-tabs {
        margin-bottom: 0;
      }

      .archive-detail-tabs[data-active-tab="images"] {
        margin-bottom: calc(var(--site-line-height) * 1em);
      }

      .archive-detail-header {
        margin-bottom: calc(var(--site-line-height) * 1em);
      }

      .ver2-hero-about.visible {
        flex-direction: column;
      }

      .ver2-hero-about-col {
        flex-basis: auto;
        max-width: 100%;
      }

      .content-text-col {
        display: block;
      }

      .content-panel-header {
        width: 100%;
        text-align: center;
        margin-top: calc(2 * var(--site-line-height) * 1em);
        margin-bottom: calc(2 * var(--site-line-height) * 1em);
      }

      .about-gap-spacer {
        flex-basis: 1em;
        align-self: auto;
        width: auto;
        margin-left: calc(-1 * var(--page-padding-left));
        margin-right: calc(-1 * var(--page-padding-right));
      }


      .content-gallery-strip {
        flex-direction: column;
      }

      .content-gallery-strip-item {
        width: 100%;
        height: auto;
      }

      .content-gallery-strip-item img {
        width: 100%;
        height: auto;
      }

      .content-gallery-name {
        font-size: var(--gallery-title-font-size-mobile);
      }
    }

    .archive-header-labels {
      display: grid;
      grid-template-columns: 1fr 1fr 2fr;
      column-gap: 8px;
      width: 100%;
      font-size: 15px;
      color: #999;
    }

    #archiveList {
      display: flex;
      flex-direction: column;
      width: 100%;
      font-size: var(--archive-list-font-size);
    }

    /* Each row is its own real grid box rather than .archive-item being
       display:contents inside one big grid. That gives each row a single
       box to hover/background, so the highlight can be one continuous bar
       with no gaps between columns. Number + title share the first column
       (1fr) so a long author list can take a wider 2fr share without
       wrapping to a second line. */
    #archiveList .archive-item {
      position: relative;
      z-index: 0;
      display: grid;
      grid-template-columns: 1fr 1fr 2fr;
      column-gap: 8px;
      width: 100%;
      padding: 3px 0;
      border-bottom: 1px solid #000000;
    }

    .archive-num-title {
      display: flex;
      flex-direction: row;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
    }

    #archiveList .archive-item:last-child {
      border-bottom: none;
    }

    /* The highlight bleeds past .archive's own left/right page padding to
       reach the true page edges, without shifting the row's actual content
       (a pseudo-element handles the bleed instead of margins on the row
       itself). */
    #archiveList .archive-item:hover::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: calc(-1 * var(--page-padding-left));
      right: calc(-1 * var(--page-padding-right));
      background: #f0f0f0;
      z-index: -1;
    }

    #archiveList .archive-item .archive-title {
      font-size: var(--archive-list-title-font-size);
      font-style: italic;
    }

    #archiveList .archive-item .archive-date {
      font-size: var(--archive-list-date-font-size);
    }

    #archiveList .archive-item .archive-authors {
      font-size: var(--archive-list-author-font-size);
    }

    .archive-item {
      display: contents;
      cursor: pointer;
      text-decoration: none;
      color: var(--color-archive);
    }

    .archive-item .archive-date {
      color: var(--color-archive);
    }

    .archive-item .archive-authors {
      color: var(--color-archive);
    }

    .archive-item .archive-title {
      color: var(--color-archive);
    }

    .archive-item .archive-number {
      color: var(--color-archive);
    }

    .archive-item.active {
      cursor: pointer;
    }

    .archive-item.active:hover {
      color: #000000;
    }

    @media (max-width: 700px) {

      .archive-header-labels {
        display: none;
      }

      #archiveList {
        display: flex;
        flex-direction: column;
      }

      #archiveList .archive-item {
        display: flex;
        flex-direction: column;
        gap: 2px;
        width: 100%;
        padding-bottom: 3px;
      }

      #archiveList .archive-item .archive-num-title {
        order: -2;
      }

    }

    .archive-detail-body {
      color: #000000;
      max-width: 75ch;
      font-size: var(--archive-text-font-size);
    }

    .content-additional-text {
      color: #000000;
      width: 100%;
      max-width: 75ch;
      min-width: 0;
      margin-top: 0;
      text-align: left;
      font-size: var(--archive-text-font-size);
    }

    .archive-detail-body p,
    .archive-detail-body h2,
    .archive-detail-body h3,
    .archive-detail-body blockquote,
    .archive-detail-body ul,
    .archive-detail-body ol,
    .content-additional-text p,
    .content-additional-text h2,
    .content-additional-text h3,
    .content-additional-text blockquote,
    .content-additional-text ul,
    .content-additional-text ol {
      margin-bottom: 16px;
    }

    .archive-detail-body > :last-child,
    .content-additional-text > :last-child {
      margin-bottom: 0;
    }

    .archive-detail-body h1,
    .content-additional-text h1,
    .ver2-hero-about h1 {
      font-size: inherit;
      font-weight: inherit;
      letter-spacing: 2px;
    }

    .archive-detail-body blockquote {
      padding-left: 16px;
      font-style: italic;
    }

    .archive-detail-body hr,
    .content-additional-text hr {
      width: 100%;
      border: none;
      margin: 8px 0 16px 0;
    }

    .content-divider-line {
      display: inline-block;
      width: 100%;
      vertical-align: middle;
    }

    .archive-detail-body a {
      text-decoration: underline;
    }

    .archive-detail-body img {
      max-width: 100%;
      display: block;
      margin-bottom: 16px;
    }

    .archive-empty,
    .archive-loading {
      padding: 10px 0;
    }

    .dev-panel {
      display: none;
      position: fixed;
      top: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 100;
      background: #e3f5ec;
      border: 1px solid #ccc;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      padding: 16px;
      width: 260px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: #222;
    }

    .dev-panel.visible {
      display: block;
    }

    .dev-panel h4 {
      font-size: 12px;
      margin-top: 16px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .dev-panel h4:first-child {
      margin-top: 0;
    }

    .dev-panel label {
      display: block;
      margin-bottom: 10px;
    }

    .dev-panel label span {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .dev-panel-hex {
      border: none;
      background: transparent;
      font: inherit;
      color: inherit;
      text-align: right;
      width: 80px;
      padding: 0;
    }

    .dev-panel input[type="range"] {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      margin: 8px 0;
    }

    .dev-panel input[type="range"]::-webkit-slider-runnable-track {
      height: 1px;
      background: black;
    }

    .dev-panel input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #e3f5ec;
      border: 1px solid black;
      margin-top: -6px;
      cursor: pointer;
    }

    .dev-panel input[type="range"]::-moz-range-track {
      height: 1px;
      background: black;
    }

    .dev-panel input[type="range"]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #e3f5ec;
      border: 1px solid black;
      cursor: pointer;
    }

    .dev-panel input[type="color"] {
      width: 100%;
      height: 32px;
      border: 1px solid #ccc;
      padding: 0;
      cursor: pointer;
      background: none;
    }

    .dev-panel .dev-panel-hint {
      color: #888;
      margin-top: 4px;

  <script>
    const devPanel = document.getElementById('devPanel');
    document.addEventListener('keydown', (e) => {
      if (e.key === 'd' || e.key === 'D') {
        devPanel.classList.toggle('visible');
      }
    });

    // Gap-spacer debug colors are off by default; press "G" to toggle them.
    let gapSpacersColored = false;
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'g' && e.key !== 'G') return;
      gapSpacersColored = !gapSpacersColored;
      colorizeGapSpacers();
    });

    const SANITY_PROJECT_ID = 'jvmgvacm';
    const SANITY_DATASET = 'production';

    const ver2Section = document.getElementById('ver2Section');
    const ver2HeroAbout = document.getElementById('ver2HeroAbout');
    const aboutCategoryGap = document.getElementById('aboutCategoryGap');
    const archiveView = document.getElementById('archiveView');
    const archiveDetail = document.getElementById('archiveDetail');
    const ver2DetailFull = document.getElementById('ver2DetailFull');

    let detailRestTop = 0;

    // Fallback target for slideDetailOverList when no list-row anchor is
    // available (e.g. the header labels row is display:none on mobile).
    function navBarBottom() {
      const navBar = document.getElementById('ver2NavBar');
      return navBar.getBoundingClientRect().bottom;
    }

    function resetDetailPosition() {
      ver2DetailFull.style.position = '';
      ver2DetailFull.style.top = '';
      ver2DetailFull.style.left = '';
      ver2DetailFull.style.width = '';
      ver2DetailFull.style.zIndex = '';
      ver2DetailFull.style.background = '';
      ver2DetailFull.style.transition = '';
    }

    // Slides `.ver2-detail-full` (which normally sits below the archive
    // list, in flow) up so it overlaps/covers the list and comes to rest
    // directly under the anchor point (the Название/Автор/Дата header row),
    // instead of scrolling the page. `anchorY` is a viewport-relative Y
    // coordinate captured by the caller *before* opening the detail — on
    // mobile, opening the detail hides the whole list via a `:has()` rule,
    // so measuring the anchor element after that point would read a
    // collapsed (0,0,0,0) rect and misplace the detail under the nav bar.
    function slideDetailOverList(anchorY) {
      resetDetailPosition();
      // Force a reflow so the natural (in-flow) position below is measured
      // fresh, not left over from a previous animation.
      // eslint-disable-next-line no-unused-expressions
      ver2DetailFull.offsetHeight;

      const parentRect = ver2Section.getBoundingClientRect();
      const startTop = ver2DetailFull.getBoundingClientRect().top - parentRect.top;
      const targetTop = anchorY != null ? anchorY - parentRect.top : startTop;
      detailRestTop = startTop;

      if (Math.abs(targetTop - startTop) < 1) return;

      ver2DetailFull.style.position = 'absolute';
      ver2DetailFull.style.left = '0';
      ver2DetailFull.style.width = '100%';
      ver2DetailFull.style.background = '#ffffff';
      ver2DetailFull.style.zIndex = '20';
      ver2DetailFull.style.top = `${startTop}px`;
      ver2DetailFull.style.transition = 'none';
      // eslint-disable-next-line no-unused-expressions
      ver2DetailFull.offsetHeight;
      ver2DetailFull.style.transition = 'top 0.4s ease';
      requestAnimationFrame(() => {
        ver2DetailFull.style.top = `${targetTop}px`;
      });
    }

    // Reverses slideDetailOverList: slides `.ver2-detail-full` all the way
    // down past the bottom edge of the viewport before hiding it, so
    // closing feels like it descends away rather than vanishing instantly.
    function slideDetailAway(afterClose) {
      if (ver2DetailFull.style.position !== 'absolute') {
        resetDetailPosition();
        if (afterClose) afterClose();
        return;
      }
      const onEnd = (evt) => {
        if (evt.propertyName !== 'top') return;
        ver2DetailFull.removeEventListener('transitionend', onEnd);
        resetDetailPosition();
        if (afterClose) afterClose();
      };
      ver2DetailFull.addEventListener('transitionend', onEnd);
      ver2DetailFull.style.transition = 'top 0.4s ease';
      const parentRect = ver2Section.getBoundingClientRect();
      const belowViewportTop = window.innerHeight - parentRect.top;
      requestAnimationFrame(() => {
        ver2DetailFull.style.top = `${belowViewportTop}px`;
      });
    }

    document.getElementById('ver2Wordmark').addEventListener('click', (e) => {
      e.preventDefault();
      archiveView.classList.remove('visible');
      archiveDetail.classList.remove('visible');
      resetDetailPosition();
      navigate('ver2');
    });
    const archiveLoading = document.getElementById('archiveLoading');
    const archiveList = document.getElementById('archiveList');
    const navStaticVer2 = document.getElementById('navStaticVer2');
    const navLinksOriginalOrderVer2 = Array.from(navStaticVer2.children);

    let archiveLoaded = false;
    let currentView = 'ver2';
    let archiveEvents = [];
    let pendingSlug = null;

    // Site language: content is fetched with all locales already loaded
    // (see LOCALE_BLOCK_FIELD), so switching language is just a re-render,
    // no re-fetch. Falls back to Russian when a locale field is empty.
    const SITE_LANGUAGES = ['ru', 'uz', 'en'];
    let currentLang = localStorage.getItem('siteLang') || 'ru';
    if (!SITE_LANGUAGES.includes(currentLang)) currentLang = 'ru';

    function L(localeString) {
      if (!localeString) return '';
      return localeString[currentLang] || localeString.ru || '';
    }

    function LB(localeBlockContent) {
      if (!localeBlockContent) return [];
      return localeBlockContent[currentLang] || localeBlockContent.ru || [];
    }

    // Fixed UI chrome copy (not editor content) in each site language.
    const UI_STRINGS = {
      menu: { ru: 'Меню', uz: 'Menyu', en: 'Menu' },
      close: { ru: 'Закрыть', uz: 'Yopish', en: 'Close' },
      archive: { ru: 'Архив', uz: 'Arxiv', en: 'Archive' },
      program: { ru: 'Программа', uz: 'Dastur', en: 'Program' },
      specialProjects: { ru: 'Спецпроекты', uz: 'Maxsus loyihalar', en: 'Special Projects' },
      info: { ru: 'Инфо', uz: 'Ma\'lumot', en: 'Info' },
      text: { ru: 'Текст', uz: 'Matn', en: 'Text' },
      additionalText: { ru: 'Дополнительный текст', uz: "Qo'shimcha matn", en: 'Additional text' },
      tabText: { ru: 'Текст', uz: 'Matn', en: 'Text' },
      tabImages: { ru: 'Изображения', uz: 'Rasmlar', en: 'Images' },
      labelTitle: { ru: 'Название', uz: 'Nomi', en: 'Title' },
      labelDate: { ru: 'Дата', uz: 'Sana', en: 'Date' },
      labelAuthor: { ru: 'Автор', uz: 'Muallif', en: 'Author' },
    };

    function parsePath(path) {
      const parts = path.replace(/\/+$/, '').split('/').filter(Boolean);
      if (parts[0] === 'archive') {
        return { view: 'archive', slug: parts[1] || null };
      }
      return { view: 'ver2', slug: null };
    }

    function pathForRoute(view, slug) {
      if (view === 'archive') return slug ? `/archive/${slug}` : '/archive';
      return '/';
    }

    function scrollToTop(target) {
      target.scrollIntoView({ behavior: 'auto', block: 'start' });
    }

    function setNavActiveOnly(links, view) {
      links.forEach((a) => {
        a.classList.toggle('active', a.dataset.view === view);
      });
    }

    function updateCategoryLabel() {
      const SECTION_VIEW_LABELS = { archive: UI_STRINGS.archive, program: UI_STRINGS.program, 'special-projects': UI_STRINGS.specialProjects };
      const sectionLabel = SECTION_VIEW_LABELS[currentView];
      document.getElementById('archiveCategoryLabel').textContent = sectionLabel ? sectionLabel[currentLang] || sectionLabel.ru : '';
    }

    function setView(view, { scroll = 'smooth' } = {}) {
      currentView = view;
      setNavActiveOnly(navLinksOriginalOrderVer2, view);
      resetDetailPosition();
      if (view === 'archive') {
        archiveView.classList.add('visible');
        archiveDetail.classList.remove('visible');
        archiveList.querySelectorAll('.archive-item').forEach((el) => el.classList.remove('selected'));
        if (!archiveLoaded) loadArchive();
      } else {
        archiveView.classList.remove('visible');
        archiveDetail.classList.remove('visible');
      }
      ver2HeroAbout.classList.toggle('visible', view === 'ver2');
      aboutCategoryGap.style.height = view === 'ver2' ? 'calc(var(--site-line-height) * 1em)' : '0px';
      updateCategoryLabel();
      if (scroll && view !== 'archive') {
        ver2Section.scrollIntoView({ behavior: scroll, block: 'start' });
      }
    }

    function navigate(view, { replace, scroll = 'smooth', slug } = {}) {
      setView(view, { scroll });
      const path = pathForRoute(view, slug || null);
      if (location.pathname !== path) {
        if (replace) {
          history.replaceState({ view }, '', path);
        } else {
          history.pushState({ view }, '', path);
        }
      }
    }

    function applyRoute(path, { isInitial } = {}) {
      const { view, slug } = parsePath(path);
      if (view === 'archive' && slug && !archiveEvents.length) {
        pendingSlug = slug;
      }
      setView(view, { scroll: isInitial ? 'auto' : 'smooth' });
      if (view === 'archive' && slug && archiveEvents.length) {
        openEventBySlug(slug, { updateUrl: false });
      }
    }

    window.addEventListener('popstate', () => {
      applyRoute(location.pathname);
    });

    // title/textTitle/additionalTextTitle are localeString objects
    // ({ru, uz, en}) and can be fetched as plain fields. text/additionalText
    // are localeBlockContent objects — each locale is its own blockContent
    // array needing the usual markDefs/image-url expansion.
    const LOCALE_BLOCK_FIELD = `{
      ru[]{ ..., markDefs[]{...}, _type == "image" => { ..., "url": asset->url } },
      uz[]{ ..., markDefs[]{...}, _type == "image" => { ..., "url": asset->url } },
      en[]{ ..., markDefs[]{...}, _type == "image" => { ..., "url": asset->url } }
    }`;

    async function loadArchive() {
      archiveLoaded = true;
      const query = encodeURIComponent(`*[_type == "event"] | order(date asc){
        title,
        date,
        "slug": slug.current,
        "venue": venue->title,
        "curatedBy": curatedBy->name,
        "authors": authors[]->name,
        textTitle,
        text${LOCALE_BLOCK_FIELD},
        galleries[]{
          name,
          type,
          images[]{ ..., "url": asset->url }
        },
        additionalTextTitle,
        additionalText${LOCALE_BLOCK_FIELD}
      }`);
      const url = `https://${SANITY_PROJECT_ID}.apicdn.sanity.io/v2024-01-01/data/query/${SANITY_DATASET}?query=${query}`;
      try {
        const res = await fetch(url);
        const { result } = await res.json();
        archiveEvents = result || [];
        renderArchive(archiveEvents);
        if (pendingSlug) {
          openEventBySlug(pendingSlug, { updateUrl: false });
          pendingSlug = null;
        }
      } catch (err) {
        archiveLoading.textContent = 'Could not load archive.';
      }
    }

    // Debug visualization: give every gap-spacer element a fresh random
    // color so the spacing that was added this session is actually visible.
    // All 148 CSS Color Module Level 4 named colors (the standard web
    // "named colors" list), so the gap-spacer debug backgrounds can pick
    // from the full named palette instead of a narrow generated range.
    const CSS_NAMED_COLORS = [

    function escapeHtml(str) {

    const MONTH_NAMES = {
      ru: ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
        'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'],

    function fmtDate(d) {
      if (!d) return '';
      const [y, m, day] = d.split('-');
      const months = MONTH_NAMES[currentLang] || MONTH_NAMES.ru;
      const monthName = months[Number(m) - 1] || m;
      if (currentLang === 'en') return `${monthName} ${Number(day)}, ${y}`;
      return `${Number(day)} ${monthName} ${y}`;
    }

    function nudgeScrollHint(el) {
      const run = () => {
        if (el.scrollWidth <= el.clientWidth) return;
        const distance = Math.min(60, el.scrollWidth - el.clientWidth);
        const duration = 550;
        const start = performance.now();
        const ease = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        function step(now) {
          const t = Math.min(1, (now - start) / duration);
          const half = t < 0.5 ? t * 2 : (1 - t) * 2;
          el.scrollLeft = distance * ease(half);
          if (t < 1) requestAnimationFrame(step);
          else el.scrollLeft = 0;
        }
        requestAnimationFrame(step);
      };
      requestAnimationFrame(() => setTimeout(run, 300));
    }

    // Builds one event's detail markup. `uid` disambiguates element ids when
    // several of these are rendered on the page at once (the "A" feed view).
    function buildEventDetailHtml(e, uid) {
      const authors = (e.authors || []).map(L).filter(Boolean).join(', ');
      const listParts = [authors, L(e.venue)].filter(Boolean).join(' — ');
      const eventIndex = archiveEvents.indexOf(e);
      const listNumber = eventIndex >= 0 ? eventIndex + 1 : 0;
      const eventText = LB(e.text);
      const eventAdditionalText = LB(e.additionalText);
      const bodyHtml = renderPortableText(eventText);
      const additionalTextHtml = renderPortableText(eventAdditionalText);

      const galleries = (e.galleries || []).filter((g) => g.images && g.images.length);
      const galleryBlocksHtml = galleries
        .map((g, gi) => galleryBlockHtml(g.images, L(g.name), g.type, gi, uid))
        .join('');

      const textPanelId = `text-panel-1-${uid}`;
      const additionalTextPanelId = `text-panel-2-${uid}`;
      const galleryAnchorId = `gallery-${uid}`;

      return `
        <div class="archive-detail-block" data-uid="${uid}">

            <div class="archive-detail-tabs" data-active-tab="images">
              <span class="archive-detail-tab" data-tab="text">${UI_STRINGS.tabText[currentLang]}</span>
              <button type="button" class="archive-detail-switch" data-active-tab="images" aria-label="Toggle text/images">
                <span class="archive-detail-switch-knob"></span>
              </button>
              <span class="archive-detail-tab active" data-tab="images">${UI_STRINGS.tabImages[currentLang]}</span>
            </div>
          ` : ''}
          <div class="archive-detail-columns" data-active-tab="images">
          <div class="content-media-col" id="${galleryAnchorId}">
            ${galleryBlocksHtml}
          </div>
          ${eventText.length || eventAdditionalText.length ? `
            <div class="content-text-row">
              ${eventText.length ? `
                <div class="accordion-panel" id="${textPanelId}">
                  <div class="content-text-col">
                    <div class="content-panel-header">${escapeHtml(L(e.textTitle) || UI_STRINGS.text[currentLang])}</div>

    // Wires up interactivity for every `.archive-detail-block` currently
    // inside `container` (there may be one, for a single selected event, or
    // many, for the "A" continuous feed).
    function wireEventDetailBlocks(container, eventsByUid) {
      // Text/Images switch: only one of the gallery or the text panels is
      // shown at a time, toggled by the animated capsule switch (or by
      // clicking either label directly) under the event title.
      container.querySelectorAll('.archive-detail-tabs').forEach((tabs) => {
        const columns = tabs.nextElementSibling;
        const switchEl = tabs.querySelector('.archive-detail-switch');
        const labels = tabs.querySelectorAll('.archive-detail-tab');
        const mediaCol = columns.querySelector('.content-media-col');
        const textRow = columns.querySelector('.content-text-row');

        // Pin the columns container to the taller of the two panels so
        // switching tabs never shrinks the page height - that shrink was
        // what made the browser clamp scroll position and jump the view.
        if (mediaCol && textRow) {
          const originalActiveTab = columns.dataset.activeTab;
          columns.removeAttribute('data-active-tab');
          const mediaHeight = mediaCol.offsetHeight;
          const textHeight = textRow.offsetHeight;
          columns.dataset.activeTab = originalActiveTab;
          columns.style.minHeight = Math.max(mediaHeight, textHeight) + 'px';
        }

        const setActiveTab = (tabName) => {
          labels.forEach((label) => label.classList.toggle('active', label.dataset.tab === tabName));
          switchEl.dataset.activeTab = tabName;
          columns.dataset.activeTab = tabName;
          tabs.dataset.activeTab = tabName;
        };

        switchEl.addEventListener('click', () => {
          setActiveTab(switchEl.dataset.activeTab === 'images' ? 'text' : 'images');
        });

        labels.forEach((label) => {
          label.addEventListener('click', () => setActiveTab(label.dataset.tab));
        });
      });

      // photoHorizontal images render at full size directly in the detail,
      // so they don't need to open the fullscreen carousel lightbox.
      container.querySelectorAll('.content-gallery-strip-item').forEach((item) => {
        const uid = item.dataset.uid;
        const galleries = (eventsByUid[uid].galleries || []).filter((g) => g.images && g.images.length);
        const gi = Number(item.dataset.galleryIndex);
        const imgIndex = Number(item.dataset.imageIndex);
        item.addEventListener('click', () => openCarousel(galleries[gi].images, imgIndex, L(galleries[gi].name)));
      });

      container.querySelectorAll('.content-gallery-strip').forEach((strip) => {
        nudgeScrollHint(strip);
      });

      // Inline (non-overlay) carousel for the photoHorizontal type: step
      // through that gallery's images in place instead of opening the
      // fullscreen lightbox.
      container.querySelectorAll('.content-gallery-horizontal').forEach((wrap) => {
        const imgs = wrap.querySelectorAll('.content-gallery-horizontal-img');
        const hit = wrap.querySelector('[data-horizontal-hit]');

        // object-fit:contain can letterbox (image smaller than its box)
        // when the photo's aspect ratio doesn't match the fixed height —
        // size the click-through nav overlay to the exact rendered photo
        // (anchored top-left, matching object-position:left top), not the
        // full box, so it never covers empty letterbox space.
        const fitHitToImage = (img) => {
          if (!hit) return;
          const apply = () => {
            const boxWidth = wrap.getBoundingClientRect().width;
            const boxHeight = img.getBoundingClientRect().height;
            if (!img.naturalWidth || !img.naturalHeight || !boxWidth || !boxHeight) return;
            const imageAspect = img.naturalWidth / img.naturalHeight;
            const boxAspect = boxWidth / boxHeight;
            const displayWidth = imageAspect > boxAspect ? boxWidth : boxHeight * imageAspect;
            const displayHeight = imageAspect > boxAspect ? boxWidth / imageAspect : boxHeight;
            hit.style.width = `${displayWidth}px`;
            hit.style.height = `${displayHeight}px`;
          };
          if (img.complete) apply();
          else img.addEventListener('load', apply, { once: true });
        };

        fitHitToImage(imgs[0]);

        const step = (delta) => {
          const current = Number(wrap.dataset.currentIndex) || 0;
          const next = (current + delta + imgs.length) % imgs.length;
          imgs[current].classList.remove('active');
          imgs[next].classList.add('active');
          wrap.dataset.currentIndex = String(next);
          fitHitToImage(imgs[next]);
        };
        const prevZone = wrap.querySelector('[data-horizontal-nav="prev"]');
        const nextZone = wrap.querySelector('[data-horizontal-nav="next"]');
        if (prevZone) prevZone.addEventListener('click', () => step(-1));
        if (nextZone) nextZone.addEventListener('click', () => step(1));
      });

      if (window.Hyphenopoly && Hyphenopoly.hyphenators && Hyphenopoly.hyphenators.ru) {
        Hyphenopoly.hyphenators.ru.then((hyphenateRU) => {
          container.querySelectorAll('.archive-detail-body').forEach((el) => hyphenateRU(el));
        });
      }
    }

    function selectEvent(index, { updateUrl = true } = {}) {
      const e = archiveEvents[index];
      if (!e) return;

      // Land at the top so opening an event always starts from a
      // deliberate, predictable scroll position.
      window.scrollTo({ top: 0, behavior: 'auto' });

      archiveList.querySelectorAll('.archive-item').forEach((el) => {
        el.classList.toggle('selected', Number(el.dataset.index) === index);
      });

      if (updateUrl && e.slug) {
        const path = pathForRoute('archive', e.slug);
        if (location.pathname !== path) {
          history.pushState({ view: 'archive', slug: e.slug }, '', path);
        }
      }

      const uid = String(index);
      archiveDetail.innerHTML = buildEventDetailHtml(e, uid);
      wireEventDetailBlocks(archiveDetail, { [uid]: e });
      colorizeGapSpacers();

      archiveDetail.querySelector('.detail-close').addEventListener('click', (evt) => {
        evt.preventDefault();
        archiveList.querySelectorAll('.archive-item').forEach((el) => el.classList.remove('selected'));
        slideDetailAway(() => {
          archiveDetail.classList.remove('visible');
        });
        // Update the URL/history directly instead of calling navigate()/setView(),
        // which would hide the detail and reset its position immediately,
        // cutting the close animation short.
        currentView = 'archive';
        const path = pathForRoute('archive', null);
        if (location.pathname !== path) {
          history.pushState({ view: 'archive' }, '', path);
        }
      });

      // Let the detail render in its natural position below the archive
      // list, rather than sliding up to cover it.
      resetDetailPosition();
      archiveDetail.classList.add('visible');

      updateDetailTopHeight();
    }

    let allEventsFeedOpen = false;

    function hasImages(e) {
      return (e.galleries || []).some((g) => g.images && g.images.length);

    function renderAllEventsFeed() {
      const eventsByUid = {};
      const feedSeparatorLine = '<div><span style="font-family: monospace;">*</span></div>';
      const feedSeparator = `<div class="feed-separator">${feedSeparatorLine.repeat(3)}</div>`;
      archiveDetail.innerHTML = archiveEvents

    function toggleAllEventsFeed() {
      if (!archiveEvents.some(hasImages)) return;

    document.addEventListener('keydown', (e) => {

      toggleAllEventsFeed();

    function updateDetailTopHeight() {
      const topRow = archiveDetail.querySelector('.archive-detail-header');

        document.documentElement.style.setProperty('--detail-top-height', `${topRow.offsetHeight}px`);

    function imageUrl(url, width) {
      if (!url) return '';
      return width ? `${url}?w=${width}&q=90&auto=format` : url;
    }

    const carousel = document.getElementById('carousel');
    const carouselImage = document.getElementById('carouselImage');
    const carouselCaption = document.getElementById('carouselCaption');
    const carouselClose = document.getElementById('carouselClose');
    const carouselPrev = document.getElementById('carouselPrev');
    const carouselNext = document.getElementById('carouselNext');

    let carouselImages = [];
    let carouselIndex = 0;
    let carouselCaptionText = '';

    function openCarousel(images, startIndex, caption) {
      if (!images.length) return;
      carouselImages = images;
      carouselIndex = startIndex;
      carouselCaptionText = caption || '';
      showCarouselImage();
      carousel.classList.add('visible');
    }

    function closeCarousel() {
      carousel.classList.remove('visible');
    }

    function showCarouselImage() {
      const img = carouselImages[carouselIndex];
      carouselImage.src = imageUrl(img.url, 1600);
      carouselCaption.textContent = carouselCaptionText;
    }

    function carouselStep(delta) {
      carouselIndex = (carouselIndex + delta + carouselImages.length) % carouselImages.length;
      showCarouselImage();
    }

    carouselClose.addEventListener('click', (e) => {
      e.preventDefault();
      closeCarousel();
    });
    carouselPrev.addEventListener('click', () => carouselStep(-1));
    carouselNext.addEventListener('click', () => carouselStep(1));

    document.addEventListener('keydown', (e) => {
      if (!carousel.classList.contains('visible')) return;
      if (e.key === 'Escape') closeCarousel();
      if (e.key === 'ArrowLeft') carouselStep(-1);
      if (e.key === 'ArrowRight') carouselStep(1);
    });

    function renderSpan(child, markDefs) {
      let text = escapeHtml(child.text || '').replace(/\n/g, '<br>');
      if (child.marks && child.marks.length) {
        child.marks.forEach((mark) => {
          if (mark === 'strong') text = `<strong>${text}</strong>`;
          else if (mark === 'em') text = `<em>${text}</em>`;
          else if (mark === 'underline') text = `<u>${text}</u>`;
          else {
            const def = (markDefs || []).find((d) => d._key === mark);
            if (def && def._type === 'link' && def.href) {
              const target = def.blank ? ' target="_blank" rel="noopener"' : '';
              text = `<a href="${escapeHtml(def.href)}"${target}>${text}</a>`;
            }
          }
        });
      }
      return text;
    }

    function renderPortableText(blocks) {
      let html = '';
      let listOpen = null;

      const closeList = () => {
        if (listOpen) {
          html += listOpen === 'bullet' ? '</ul>' : '</ol>';
          listOpen = null;
        }
      };

      blocks.forEach((block) => {
        if (block._type === 'image') {
          closeList();
          html += `<img src="${imageUrl(block.url, 800)}" alt="">`;
          return;
        }
        if (block._type === 'divider') {
          closeList();
          html += '<hr>';
          return;
        }
        if (block._type !== 'block') return;

        const listItem = block.listItem;
        if (listItem) {
          if (listOpen !== listItem) {
            closeList();
            html += listItem === 'bullet' ? '<ul>' : '<ol>';
            listOpen = listItem;
          }
          const inner = (block.children || []).map((c) => renderSpan(c, block.markDefs)).join('');
          html += `<li>${inner}</li>`;
          return;
        }

        closeList();
        const inner = (block.children || []).map((c) => renderSpan(c, block.markDefs)).join('');
        const tag = { h1: 'h1', h2: 'h2', h3: 'h3', blockquote: 'blockquote' }[block.style] || 'p';

        const isDividerLine = (line) => /^\*{3,}$/.test(line.replace(/<[^>]+>/g, '').trim());
        const withDividers = inner
          .split('<br>')
          .map((line) => {
            if (isDividerLine(line)) return '<span class="content-divider-line"></span>';
            return line;
          })
          .join('<br>');
        html += `<${tag}>${withDividers}</${tag}>`;
      });

      closeList();
      return html;
    }

    let aboutData = null;

    function renderAboutColumn(localeBlockContent) {
      const rawHtml = renderPortableText(LB(localeBlockContent));
      return rawHtml.replace(/\*/g, '<span style="font-family: monospace;">*</span>').replace(
        /139 Documentary Center/g,
        '<span class="about-highlight">139 Documentary Center</span>'
      );
    }

    function renderAbout() {
      if (!aboutData) return;
      const col1 = renderAboutColumn(aboutData.text1);
      const col2Html = LB(aboutData.text2).length ? renderAboutColumn(aboutData.text2) : '';
      ver2HeroAbout.innerHTML = `
        <div class="ver2-hero-about-col">${col1}</div>
        ${col2Html ? '<div class="about-gap-spacer"></div>' : ''}
        ${col2Html ? `<div class="ver2-hero-about-col">${col2Html}</div>` : ''}
      `;

          archiveView.classList.remove('visible');
          archiveDetail.classList.remove('visible');
          navigate('ver2');
          setMenuOpen(false);
        });
      });
      colorizeGapSpacers();
    }

    async function loadAbout() {
      const query = encodeURIComponent(`*[_id == "about"][0]{
        text1${LOCALE_BLOCK_FIELD},
        text2${LOCALE_BLOCK_FIELD}
      }`);
      const url = `https://${SANITY_PROJECT_ID}.apicdn.sanity.io/v2024-01-01/data/query/${SANITY_DATASET}?query=${query}`;
      try {
        const res = await fetch(url);
        const { result } = await res.json();
        aboutData = result || {};
        renderAbout();
      } catch (err) {
        ver2HeroAbout.innerHTML = '<p>Could not load About.</p>';
      }
    }

    loadAbout();

    const ver2NavBar = document.getElementById('ver2NavBar');
    const navBurgerToggle = document.getElementById('navBurgerToggle');

    function updateBurgerLabel() {
      const isOpen = ver2NavBar.classList.contains('open');
      const strings = isOpen ? UI_STRINGS.close : UI_STRINGS.menu;
      navBurgerToggle.textContent = strings[currentLang] || strings.ru;
    }

    const ver2NavTopRow = document.querySelector('.ver2-nav-top-row');
    const ver2Wordmark = document.getElementById('ver2Wordmark');

    function syncNavOverlayOffset() {
      const rowOffset = ver2NavTopRow.getBoundingClientRect().height;
      ver2NavBar.style.setProperty('--nav-overlay-offset', `${rowOffset}px`);

      // Nav items should be centered under the logo text itself, not under
      // the logo+Menu pair (Menu's extra width shifts the pair's own
      // center right of the logo's center).
      const wordmarkRect = ver2Wordmark.getBoundingClientRect();
      const wordmarkCenterX = wordmarkRect.left + wordmarkRect.width / 2;
      const viewportCenterX = window.innerWidth / 2;
      const centerOffset = wordmarkCenterX - viewportCenterX;
      ver2NavBar.style.setProperty('--nav-overlay-center-offset', `${centerOffset}px`);
    }

    function setMenuOpen(isOpen) {
      ver2NavBar.classList.toggle('open', isOpen);
      updateBurgerLabel();
      if (isOpen) syncNavOverlayOffset();
    }

    window.addEventListener('resize', () => {
      if (ver2NavBar.classList.contains('open')) syncNavOverlayOffset();
    });

    navStaticVer2.querySelectorAll('a[data-view]').forEach((a) => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        setMenuOpen(false);
        navigate(a.dataset.view);
      });
    });

    navStaticVer2.addEventListener('click', (e) => {
      if (e.target === navStaticVer2) {
        setMenuOpen(false);
      }
    });

    navBurgerToggle.addEventListener('click', (e) => {
      e.preventDefault();
      setMenuOpen(!ver2NavBar.classList.contains('open'));
    });

    updateBurgerLabel();

    const redirectPath = sessionStorage.getItem('redirectPath');
    if (redirectPath) {
      sessionStorage.removeItem('redirectPath');
      history.replaceState(null, '', redirectPath);
    }
    applyRoute(location.pathname, { isInitial: true });

    function downloadMarkdown(filename, content) {
      const blob = new Blob([content], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // --- Site typography controls ---
    const siteFontSize = document.getElementById('siteFontSize');
    const siteLineHeight = document.getElementById('siteLineHeight');

    const siteFontSizeVal = document.getElementById('siteFontSizeVal');
    const siteLineHeightVal = document.getElementById('siteLineHeightVal');
    const siteLetterSpacingVal = document.getElementById('siteLetterSpacingVal');

    galleryImageHeight.addEventListener('input', () => {

    const galleryHorizontalImageHeight = document.getElementById('galleryHorizontalImageHeight');

    siteLineHeight.addEventListener('input', () => {

      document.documentElement.style.setProperty('--site-letter-spacing', `${siteLetterSpacing.value}px`);
      siteLetterSpacingVal.textContent = Number(siteLetterSpacing.value).toFixed(2);
      updateDetailTopHeight();
    });

    [
      ['pagePaddingTop', '--page-padding-top'],
      ['pagePaddingRight', '--page-padding-right'],
      ['pagePaddingBottom', '--page-padding-bottom'],
      ['pagePaddingLeft', '--page-padding-left'],
    ].forEach(([id, cssVar]) => {
      const input = document.getElementById(id);
      const valEl = document.getElementById(`${id}Val`);
      input.addEventListener('input', () => {
        document.documentElement.style.setProperty(cssVar, `${input.value}px`);
        valEl.textContent = input.value;
        updateDetailTopHeight();
      });
    });

    const navFontSize = document.getElementById('navFontSize');
    const navFontSizeVal = document.getElementById('navFontSizeVal');

    navFontSize.addEventListener('input', () => {
      document.documentElement.style.setProperty('--nav-font-size', `${navFontSize.value}px`);
      navFontSizeVal.textContent = navFontSize.value;
    });

    const HEX_COLOR_RE = /^#[0-9a-f]{6}$/i;

    function wireColorPair(colorInput, hexInput, cssVar) {
      colorInput.addEventListener('input', () => {
        document.documentElement.style.setProperty(cssVar, colorInput.value);
        hexInput.value = colorInput.value;
      });
      hexInput.addEventListener('input', () => {
        if (!HEX_COLOR_RE.test(hexInput.value)) return;
        colorInput.value = hexInput.value;
        document.documentElement.style.setProperty(cssVar, hexInput.value);
        colorInput.dispatchEvent(new Event('change'));
        saveSettings();
      });
    }

    wireColorPair(siteColor, siteColorVal, '--site-color');

    // --- Section colors ---
    const SECTION_COLORS = [
      { id: 'colorAbout', cssVar: '--color-about' },
      { id: 'colorArchive', cssVar: '--color-archive' },
      { id: 'colorEventTitle', cssVar: '--color-event-title' },
      { id: 'colorEventText', cssVar: '--color-event-text' },
      { id: 'colorMenu', cssVar: '--color-menu' },
      { id: 'bgAbout', cssVar: '--bg-about' },
      { id: 'bgArchive', cssVar: '--bg-archive' },
      { id: 'bgEvent', cssVar: '--bg-event' },
      { id: 'bgEventGallery', cssVar: '--bg-event-gallery' },
      { id: 'bgEventText', cssVar: '--bg-event-text' },
    ];

    SECTION_COLORS.forEach(({ id, cssVar }) => {
      const input = document.getElementById(id);
      const valEl = document.getElementById(`${id}Val`);
      wireColorPair(input, valEl, cssVar);
    });

    // --- Hyphenation tuning (requires reload to take effect) ---
    ['hyphMinWordLength', 'hyphLeftmin', 'hyphRightmin'].forEach((id) => {
      const input = document.getElementById(id);
      const valEl = document.getElementById(`${id}Val`);
      input.addEventListener('input', () => {
        valEl.textContent = input.value;
      });
      input.addEventListener('change', () => {
        saveSettings();
        location.reload();
      });
    });

    document.getElementById('allSave').addEventListener('click', () => {
      const md = `# Site Typography Settings

- Text size: ${siteFontSize.value}px
- Archive text size: ${archiveTextFontSize.value}px
- Archive list text size: ${archiveListFontSize.value}px
- Archive list title size: ${archiveListTitleFontSize.value}px
- Archive list date size: ${archiveListDateFontSize.value}px
- Archive list author size: ${archiveListAuthorFontSize.value}px
- Gallery title size desktop: ${galleryTitleFontSizeDesktop.value}px
- Gallery title size mobile: ${galleryTitleFontSizeMobile.value}px
- Gallery image gap: ${galleryImageGap.value}px
- Gallery row gap: ${galleryRowGap.value}px
- Gallery block gap: ${galleryBlockGap.value}px
- Gallery image height: ${galleryImageHeight.value}vh
- Gallery horizontal image height: ${galleryHorizontalImageHeight.value}vh
- Line height: ${siteLineHeight.value}
- Letter spacing: ${siteLetterSpacing.value}px
- Page padding top: ${document.getElementById('pagePaddingTop').value}px
- Page padding right: ${document.getElementById('pagePaddingRight').value}px
- Page padding bottom: ${document.getElementById('pagePaddingBottom').value}px
- Page padding left: ${document.getElementById('pagePaddingLeft').value}px
- Nav text size: ${navFontSize.value}px
- Color: ${siteColor.value}
- About color: ${document.getElementById('colorAbout').value}
- Archive color: ${document.getElementById('colorArchive').value}
- Event title color: ${document.getElementById('colorEventTitle').value}
- Event text color: ${document.getElementById('colorEventText').value}
- Menu color: ${document.getElementById('colorMenu').value}
- About bg: ${document.getElementById('bgAbout').value}
- Archive bg: ${document.getElementById('bgArchive').value}
- Event bg: ${document.getElementById('bgEvent').value}
- Event gallery bg: ${document.getElementById('bgEventGallery').value}
- Event text bg: ${document.getElementById('bgEventText').value}
`;
      downloadMarkdown('site-typography-settings.md', md);
    });

    // --- Persist typography settings in this browser ---
    const TYPOGRAPHY_STORAGE_KEY = 'typographySettings';
    const SLIDER_IDS = ['siteFontSize', 'archiveTextFontSize', 'archiveListFontSize', 'archiveListTitleFontSize', 'archiveListDateFontSize', 'archiveListAuthorFontSize', 'galleryTitleFontSizeDesktop', 'galleryTitleFontSizeMobile', 'galleryImageGap', 'galleryRowGap', 'galleryBlockGap', 'galleryImageHeight', 'galleryHorizontalImageHeight', 'siteLineHeight', 'siteLetterSpacing', 'pagePaddingTop', 'pagePaddingRight', 'pagePaddingBottom', 'pagePaddingLeft', 'navFontSize', 'siteColor', 'colorAbout', 'colorArchive', 'colorEventTitle', 'colorEventText', 'colorMenu', 'bgAbout', 'bgArchive', 'bgEvent', 'bgEventGallery', 'bgEventText', 'hyphMinWordLength', 'hyphLeftmin', 'hyphRightmin'];

    function collectSettings() {
      const settings = {};
      SLIDER_IDS.forEach((id) => {
        const el = document.getElementById(id);
        if (el) settings[id] = el.value;
      });
      return settings;
    }

    function saveSettings() {
      localStorage.setItem(TYPOGRAPHY_STORAGE_KEY, JSON.stringify(collectSettings()));
    }

    function applySettings(settings) {
      SLIDER_IDS.forEach((id) => {
        if (settings[id] === undefined) return;
        const el = document.getElementById(id);
        if (!el) return;
        el.value = settings[id];
        el.dispatchEvent(new Event('input'));
      });
    }

    devPanel.addEventListener('input', (e) => {
      if (e.target.matches('input[type="range"], input[type="color"]')) saveSettings();
    });

    document.getElementById('allApply').addEventListener('click', () => {
      const saved = localStorage.getItem(TYPOGRAPHY_STORAGE_KEY);
      if (saved) applySettings(JSON.parse(saved));
    });

    const savedTypography = localStorage.getItem(TYPOGRAPHY_STORAGE_KEY);
    if (savedTypography) {
      try {
        applySettings(JSON.parse(savedTypography));
      } catch (err) {
        // ignore corrupt saved settings
      }
    }
  </script>
  <script type="text/javascript">
    function applyUiStrings() {
      document.querySelectorAll('[data-i18n]').forEach((el) => {
        const strings = UI_STRINGS[el.dataset.i18n];
        if (strings) el.textContent = strings[currentLang] || strings.ru;
      });
    }

    function setSiteLanguage(lang) {
      if (!SITE_LANGUAGES.includes(lang) || lang === currentLang) return;
      currentLang = lang;
      localStorage.setItem('siteLang', lang);
      document.documentElement.lang = lang;

      updateNavLanguageLabel();
      applyUiStrings();
      updateBurgerLabel();
      updateCategoryLabel();
      renderAbout();

      if (archiveLoaded) {
        renderArchive(archiveEvents);
        const selectedEl = archiveList.querySelector('.archive-item.selected');
        if (allEventsFeedOpen) {
          renderAllEventsFeed();
        } else if (selectedEl) {
          selectEvent(Number(selectedEl.dataset.index), { updateUrl: false });
        }
      }
    }

    document.documentElement.lang = currentLang;
    applyUiStrings();
    colorizeGapSpacers();

    const LANGUAGE_NAMES = { uz: 'Uzbek', ru: 'Russian', en: 'English' };
    const navLanguageGroup = document.getElementById('navLanguageGroup');

    function updateNavLanguageLabel() {
      navLanguageGroup.querySelectorAll('a').forEach((a) => {
        a.classList.toggle('active', a.dataset.lang === currentLang);
      });
    }

    navLanguageGroup.innerHTML = SITE_LANGUAGES
      .map((lang) => `<a href="#" data-lang="${lang}">${LANGUAGE_NAMES[lang]}</a>`)
      .join('');
    navLanguageGroup.querySelectorAll('a').forEach((a) => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        setSiteLanguage(a.dataset.lang);
      });
    });

    updateNavLanguageLabel();
  </script>
